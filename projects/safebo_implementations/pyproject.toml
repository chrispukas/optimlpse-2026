[build-system]
requires = ["setuptools>=65.6.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name="safebo_simpl"
version = "0.1.0"
description = "Various implementations of safe Bayesian optimisation algorithms"
authors = [
    { name = "Christopher Pukas", email = "christopher.pukas@gmail.com" }
]
readme = "README.md"

requires-python = ">=3.14"
license = { file = "MIT" }

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["safebo_simpl"]